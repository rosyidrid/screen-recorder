name: SCREEN RECORDER

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            
            cd recorder.rosyidrid.com/

            # ─────────────────────────────────────
            # 1. AMBIL STATE TERKINI (TANPA PULL)
            # ─────────────────────────────────────
            git fetch origin

            BASE=$(git rev-parse HEAD)
            TARGET=$(git rev-parse origin/main)

            echo "📌 Base commit  : $BASE"
            echo "📌 Target commit : $TARGET"

            # AMBIL CHANGES SEBELUM RESET
            CHANGED=$(git diff --name-only $BASE $TARGET || true)

            echo "📋 Files changed:"
            echo "$CHANGED"

            # ─────────────────────────────────────
            # 2. UPDATE WORKING DIRECTORY
            # ─────────────────────────────────────
            git reset --hard origin/main
            git clean -fd

      # === Notifikasi Discord ===
      - name: Notify Discord (embed)
        if: always() # kirim apapun status job
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          STATUS="${STATUS:-success}"
          EMOJI="❌"; COLOR=15548997    # merah
          if [ "$STATUS" = "success" ]; then EMOJI="✅"; COLOR=5763719; fi   # hijau
          if [ "$STATUS" = "cancelled" ]; then EMOJI="🟡"; COLOR=16776960; fi # kuning

          DESC=$'**Repo:** '"$REPO"$'\n**Branch:** '"$REF"$'\n**Commit:** '"${SHA:0:7}"$'\n**By:** '"$ACTOR"$'\n[View run]('"$RUN_URL"$')'

          # Pakai jq kalau tersedia, kalau tidak fallback ke payload simple
          if command -v jq >/dev/null 2>&1; then
            jq -nc --arg title "$EMOJI $WORKFLOW • $STATUS" \
                   --arg desc "$DESC" \
                   --argjson color $COLOR \
                   '{embeds:[{title:$title, description:$desc, color:$color}]}' \
            | curl -sS -H "Content-Type: application/json" -d @- "$WEBHOOK_URL"
          else
            # Fallback tanpa embed
            MSG="**$EMOJI $STATUS** on **$REPO**\nBranch: \`$REF\`\nCommit: \`${SHA:0:7}\`\nBy: **$ACTOR**\nRun: $RUN_URL"
            PAYLOAD=$(printf '{"content": "%s"}' "$(echo "$MSG" | sed 's/"/\\"/g')")
            curl -sS -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK_URL"
          fi
